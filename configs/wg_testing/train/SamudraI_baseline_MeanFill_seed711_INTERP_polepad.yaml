save_checkpoint: true
seed: 711
validate_using_ema: true
train_evaluation_samples: 0
ema:
  decay: 0.999
max_epochs: 100
inference:
  n_forward_steps: 365
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '1991-01-03T12:00:00'
      - '1996-01-03T12:00:00'
    dataset:
      data_path: /scratch/cimes/wg4031/Emulator_data/Ocean/
      file_pattern: 1958-2022.OM41deg_Samudra_5daily_means_NoLeap.zarr
      engine: zarr
    num_data_workers: 2
  aggregator:
    log_histograms: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-samudraI-om4
  entity: ai2cm
  wandb_dir_in_experiment_dir: true
train_loader:
  batch_size: 8
  num_data_workers: 2
  prefetch_factor: 2
  time_buffer: 20
  dataset:
    concat:
    - data_path: /scratch/cimes/wg4031/Emulator_data/Ocean/
      file_pattern: 1958-2022.OM41deg_Samudra_5daily_means_NoLeap.zarr
      engine: zarr
      subset:
        start_time: '1969-01-03T12:00:00'
        stop_time: '1990-12-29T12:00:00'
    - data_path: /scratch/cimes/wg4031/Emulator_data/Ocean/
      file_pattern: 1958-2022.OM41deg_Samudra_5daily_means_NoLeap.zarr
      engine: zarr
      subset:
        start_time: '2008-01-03T12:00:00'
        stop_time: '2022-12-29T12:00:00'
validation:
  loader:
    batch_size: 8
    num_data_workers: 2
    prefetch_factor: 2
    time_buffer: 20
    dataset:
      data_path: /scratch/cimes/wg4031/Emulator_data/Ocean/
      file_pattern: 1958-2022.OM41deg_Samudra_5daily_means_NoLeap.zarr
      engine: zarr
      subset:
        start_time: '2001-01-03T12:00:00'
        stop_time: '2007-12-29T12:00:00'
